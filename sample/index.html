<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề kiểm tra mẫu (chấm điểm + gửi Google Sheet)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #eef2f7; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; border-radius: 32px; padding: 20px 25px; }
        h1 { color: #1e466e; text-align: center; }
        .score-area { background: #e9ecef; border-radius: 60px; padding: 12px 20px; display: flex; justify-content: space-between; margin: 20px 0; flex-wrap: wrap; }
        .progress-bar { background: #cbd5e1; height: 10px; border-radius: 10px; margin: 15px 0; }
        .progress-fill { background: #2a66d6; width: 0%; height: 10px; border-radius: 10px; }
        .student-info { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .student-info input { flex: 1; padding: 12px; border-radius: 40px; border: 1px solid #ccc; }
        .question-card { background: #f8fafc; border-radius: 20px; padding: 15px 20px; margin-bottom: 15px; }
        .question-text { font-weight: 700; margin-bottom: 12px; }
        .options { display: flex; flex-wrap: wrap; gap: 12px; }
        .option { background: white; border: 1px solid #ccc; border-radius: 40px; padding: 6px 16px; cursor: pointer; }
        .option.selected { background: #1e466e; color: white; }
        .correct-highlight { background: #bbf7d0 !important; border-color: #15803d !important; }
        .wrong-highlight { background: #fecaca !important; border-color: #b91c1c !important; }
        button { background: #1e466e; color: white; border: none; padding: 14px; border-radius: 60px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
        .reset-btn { background: #6c757d; margin-top: 8px; }
        .msg { padding: 12px; border-radius: 20px; text-align: center; margin-top: 15px; }
        .success { background: #dcfce7; color: #166534; }
        .warning { background: #fff3e3; color: #b45309; }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Đề kiểm tra mẫu</h1>
    <div class="score-area">
        <span>🎯 Điểm: <strong id="scoreDisplay">0</strong> / <span id="totalQ"></span></span>
        <span>✅ Đã trả lời: <strong id="answeredCount">0</strong></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    
    <div class="student-info">
        <input type="text" id="studentName" placeholder="Họ tên học sinh">
        <input type="text" id="classCode" placeholder="Lớp / Mã đề">
    </div>
    
    <div id="questionsContainer"></div>
    
    <button id="submitBtn">📤 NỘP BÀI & XEM ĐIỂM</button>
    <button id="resetBtn" class="reset-btn">🔄 Làm lại</button>
    <div id="messageBox"></div>
</div>

<script src="data.js"></script>
<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_URL_HERE/exec";  // 👈 Thay URL
    const SHEET_TAB_NAME = "KetQuaMau";   // 👈 Tên tab trong Google Sheet
    
    let userAnswers = {};
    let submitted = false;
    
    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        QUESTIONS.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.qid = q.id;
            let optsHtml = '';
            q.options.forEach(opt => {
                const letter = opt.charAt(0);
                const isSelected = (userAnswers[q.id] === letter);
                let extraClass = '';
                if (submitted) {
                    if (letter === q.correct) extraClass = 'correct-highlight';
                    else if (isSelected && letter !== q.correct) extraClass = 'wrong-highlight';
                }
                optsHtml += `<div class="option ${isSelected ? 'selected' : ''} ${extraClass}" data-val="${letter}">
                                <input type="radio" name="q${q.id}" value="${letter}" ${isSelected ? 'checked' : ''} style="display:none;">
                                <span>${opt}</span>
                            </div>`;
            });
            card.innerHTML = `<div class="question-text">${q.text}</div><div class="options">${optsHtml}</div>`;
            container.appendChild(card);
        });
        attachEvents();
        updateStatsAndScore();
    }
    
    function attachEvents() {
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                if (submitted) { showMsg('Đã nộp bài, hãy nhấn "Làm lại" để làm mới.', 'warning'); return; }
                const parent = opt.parentElement;
                parent.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                const radio = opt.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
                const qid = opt.closest('.question-card').dataset.qid;
                userAnswers[qid] = radio.value;
                saveToLocal();
                updateStatsAndScore();
            });
        });
    }
    
    function calculateScore() {
        let correct = 0;
        for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
            const ans = userAnswers[i];
            const q = QUESTIONS.find(qq => qq.id == i);
            if (ans && q && ans === q.correct) correct++;
        }
        return correct;
    }
    
    function updateStatsAndScore() {
        const answered = Object.keys(userAnswers).length;
        document.getElementById('answeredCount').innerText = answered;
        const percent = (answered / TOTAL_QUESTIONS) * 100;
        document.getElementById('progressFill').style.width = percent + '%';
        if (submitted) document.getElementById('scoreDisplay').innerText = calculateScore();
        else document.getElementById('scoreDisplay').innerText = '?';
    }
    
    function saveToLocal() { localStorage.setItem('quiz_data', JSON.stringify({ answers: userAnswers, submitted: false })); }
    function loadFromLocal() {
        const raw = localStorage.getItem('quiz_data');
        if (raw) try { const d = JSON.parse(raw); userAnswers = d.answers || {}; } catch(e) {}
    }
    
    async function submitQuiz() {
        if (submitted) { showMsg('Bài đã nộp, hãy làm lại nếu muốn.', 'warning'); return; }
        const name = document.getElementById('studentName').value.trim();
        if (!name) { showMsg('⚠️ Nhập tên học sinh!', 'warning'); return; }
        const answered = Object.keys(userAnswers).length;
        if (answered === 0) { showMsg('⚠️ Chưa có câu trả lời nào!', 'warning'); return; }
        
        const score = calculateScore();
        submitted = true;
        document.getElementById('scoreDisplay').innerText = score;
        renderQuestions(); // hiện highlight
        
        // Chuẩn bị mảng đáp án
        const answerArr = [];
        for (let i = 1; i <= TOTAL_QUESTIONS; i++) answerArr.push(userAnswers[i] || "");
        const answerStr = answerArr.join(',');
        const answerJson = JSON.stringify(userAnswers);
        
        const payload = {
            sheetName: SHEET_TAB_NAME,
            thoiGian: new Date().toISOString(),
            tenHocSinh: name,
            maDe: document.getElementById('classCode').value.trim() || "KhongMa",
            ketQua: `${score}/${TOTAL_QUESTIONS}`,
            cauTraLoi: answerJson,
            chiTiet: answerStr
        };
        
        fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(payload) })
            .catch(e => console.log(e));
        showMsg(`✅ Điểm: ${score}/${TOTAL_QUESTIONS}. Kết quả đã gửi giáo viên.`, 'success');
    }
    
    function resetAll() {
        userAnswers = {};
        submitted = false;
        localStorage.removeItem('quiz_data');
        renderQuestions();
        showMsg('Đã xoá toàn bộ, hãy làm bài lại.', 'warning');
        document.getElementById('scoreDisplay').innerText = '?';
    }
    
    function showMsg(text, type) {
        const box = document.getElementById('messageBox');
        box.innerHTML = `<div class="msg ${type}">${text}</div>`;
        setTimeout(() => { if (box.innerHTML.includes(text)) box.innerHTML = ''; }, 4000);
    }
    
    document.getElementById('totalQ').innerText = TOTAL_QUESTIONS;
    loadFromLocal();
    renderQuestions();
    document.getElementById('submitBtn').onclick = submitQuiz;
    document.getElementById('resetBtn').onclick = resetAll;
</script>
</body>
</html>
