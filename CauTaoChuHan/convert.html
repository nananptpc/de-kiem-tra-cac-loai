<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chuyển CSV → data.js</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0f172a; color: #e2e8f0; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        button { margin: 10px; padding: 10px 20px; cursor: pointer; }
        pre { background: #1e293b; padding: 15px; border-radius: 12px; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>🔄 Chuyển CSV → data.js</h2>
    <textarea id="csvInput" placeholder="Dán nội dung CSV vào đây..."></textarea>
    <br>
    <button id="convertBtn">✨ Chuyển đổi</button>
    <button id="copyBtn">📋 Copy</button>
    <h3>Kết quả (copy toàn bộ vào data.js):</h3>
    <pre id="output"></pre>

    <script>
        function csvToDataJs(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            if (lines.length < 2) return "// Lỗi: CSV phải có header + dữ liệu";
            
            const headers = lines[0].split(',').map(h => h.trim());
            const questions = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const parts = lines[i].split(',').map(p => p.trim());
                if (parts.length < 7) continue;
                
                questions.push({
                    id: parseInt(parts[0]),
                    text: parts[1],
                    options: [
                        "A. " + parts[2],
                        "B. " + parts[3],
                        "C. " + parts[4],
                        "D. " + parts[5]
                    ],
                    correct: parts[6].toUpperCase()
                });
            }
            
            let jsContent = "// ========== DỮ LIỆU TỪ CSV ==========\n";
            jsContent += "const QUESTIONS = " + JSON.stringify(questions, null, 2) + ";\n\n";
            jsContent += "const TOTAL_QUESTIONS = QUESTIONS.length;\n";
            return jsContent;
        }
        
        document.getElementById('convertBtn').onclick = () => {
            const csv = document.getElementById('csvInput').value;
            if (!csv.trim()) { alert('Hãy dán CSV vào!'); return; }
            document.getElementById('output').innerText = csvToDataJs(csv);
        };
        
        document.getElementById('copyBtn').onclick = () => {
            const code = document.getElementById('output').innerText;
            if (!code) { alert('Chưa có kết quả!'); return; }
            navigator.clipboard.writeText(code);
            alert('✅ Đã copy! Dán vào file data.js');
        };
    </script>
</body>
</html>
